<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<div id="list"></div>
<script>
  const list = document.getElementById('list');
  for (let i = 0; i < 6000; i++) {
    const b = document.createElement('button');
    b.textContent = `Button ${i}`;
    list.appendChild(b);
  }
</script>
