<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<div id="root"></div>
<script>
  // 100 nested flex boxes, each with a long paragraph: every container's textContent holds all the text below it.
  let parent = document.getElementById('root');
  const words = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. '.repeat(40);
  for (let i = 0; i < 1500; i++) {
    const box = document.createElement('div');
    box.style.display = 'flex';
    box.style.flexDirection = 'column';
    const p = document.createElement('p');
    p.textContent = `${i} ${words}`;
    box.appendChild(p);
    parent.appendChild(box);
    parent = box;
  }
</script>
