<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A promo banner with a fixed 400 px width runs past narrow windows: 48 dp past the Flip cover,
     40 dp past the Flip inner display. Centred on the Pixel 9 Pro Fold, it crosses the crease. -->
<title>Fixed-width banner</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  main { padding: 16px 0; }
  main > p { margin: 0 16px 12px; }
  .promo { width: 400px; margin: 0 auto 12px; padding: 16px; background: #ffe082; border-radius: 12px; }
  .promo p { margin: 0; }
</style>
</head>
<body>
<main>
  <p>Order ahead and pick up at the counter or at the drive-through.</p>
  <div class="promo"><p>Weekend offer: any large meal comes with a free dessert of your choice.</p></div>
</main>
</body>
</html>
