<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A hero laid out for one wide screen, with no segment awareness. Its centred heading and call
     to action land on the Surface Duo 2 hinge (x 537 to 563 of 1100) and on the Pixel 9 Pro Fold
     crease (about x 425 of 851). -->
<title>Call to action across the hinge</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; background: #fff8e1; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  button { width: 200px; min-height: 48px; font: inherit; border: 0; border-radius: 24px; background: #c62828; color: #fff; }
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>Breakfast is served all day</h1>
    <button type="button">Order now</button>
  </section>
</main>
</body>
</html>
